        :root {
            --glass-bg-dark: rgba(8, 47, 73, 0.6);

            --glass-bg-light: rgba(255, 255, 255, 0.8);

        }

        body {
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Glassmorphism Classes */
        .glass {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        
        .dark .glass {
            background-color: var(--glass-bg-dark);
            border: 1px solid var(--glass-border-dark);
        }

        .light .glass {
            background-color: var(--glass-bg-light);
            border: 1px solid var(--glass-border-light);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);

        /* Toast / Easter Egg Animation */
        .toast-enter {
            transform: translateY(100%);
            opacity: 0;
        }
        .toast-enter-active {
            transform: translateY(0);
            opacity: 1;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .toast-exit {
            transform: translateY(0);
            opacity: 1;
        }
        .toast-exit-active {
            transform: translateY(100%);
            opacity: 0;

                const container = document.getElementById('toast-container');
                const toast = document.createElement('div');
                
                let icon = 'ph-info';
                let colorClass = 'border-cyber-500 bg-cyber-500/10 text-cyber-500';
                
                if(type === 'success') { icon = 'ph-check-circle'; colorClass = 'border-cyber-green bg-cyber-green/10 text-cyber-green'; }
                if(type === 'warning') { icon = 'ph-warning'; colorClass = 'border-amber-500 bg-amber-500/10 text-amber-500'; }
                if(type === 'cyber') { icon = 'ph-terminal'; colorClass = 'border-cyber-purple bg-cyber-purple/10 text-cyber-purple shadow-[0_0_15px_rgba(139,92,246,0.5)]'; }

                toast.className = `glass border-l-4 p-4 rounded-r-lg shadow-lg flex items-center gap-3 toast-enter dark:text-white ${colorClass}`;
                toast.innerHTML = `<i class="ph ${icon} text-xl"></i><span class="font-medium text-sm">${message}</span>`;
                
                container.appendChild(toast);
                
                // Trigger reflow
                void toast.offsetWidth;
                toast.classList.remove('toast-enter');
                toast.classList.add('toast-enter-active');
                
                setTimeout(() => {
                    toast.classList.remove('toast-enter-active');
                    toast.classList.add('toast-exit-active');
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            }
        };

        // Theme Logic
        function initTheme() {
            const toggleBtn = document.getElementById('theme-toggle');
            
            // Check local storage or system preference
            if (THEME_CONFIG.rememberPreference) {
                if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    isDarkMode = true;
                } else {
                    isDarkMode = false;
                }
            }
            
            updateThemeDOM();

            toggleBtn.addEventListener('click', () => {
                isDarkMode = !isDarkMode;
                updateThemeDOM();
                if(THEME_CONFIG.rememberPreference) {
                    localStorage.setItem('theme', isDarkMode ? 'dark' : 'light');
                }
            });
        }

        function updateThemeDOM() {
            if (isDarkMode) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        // Mobile Menu Logic
        function initMobileMenu() {
            const btn = document.getElementById('mobile-menu-btn');
            const closeBtn = document.getElementById('mobile-close-btn');
            const menu = document.getElementById('mobile-menu');
            const overlay = document.getElementById('mobile-overlay');
            const links = menu.querySelectorAll('a');

            function toggleMenu(show) {
                if(show) {
                    menu.classList.remove('translate-x-full');
                    overlay.classList.remove('hidden');
                    // Slight delay for overlay fade
                    setTimeout(() => overlay.classList.remove('opacity-0'), 10);
                    btn.setAttribute('aria-expanded', 'true');
                    document.body.style.overflow = 'hidden'; // lock scroll
                } else {
                    menu.classList.add('translate-x-full');
                    overlay.classList.add('opacity-0');
                    setTimeout(() => overlay.classList.add('hidden'), 300);
                    btn.setAttribute('aria-expanded', 'false');
                    document.body.style.overflow = '';
                }
            }

            btn.addEventListener('click', () => toggleMenu(true));
            closeBtn.addEventListener('click', () => toggleMenu(false));
            overlay.addEventListener('click', () => toggleMenu(false));
            
            links.forEach(link => {
                link.addEventListener('click', () => toggleMenu(false));
            });

            // Close on Escape
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && btn.getAttribute('aria-expanded') === 'true') {
                    toggleMenu(false);
                }
            });
        }

        // Cyber Easter Egg Logic
        function initEasterEgg() {
            if(!FEATURES.cyberEasterEgg) return;
            
            let buffer = '';
            const secret = 'sudo'; // type 'sudo' anywhere on the page
            
            document.addEventListener('keydown', (e) => {
                if(e.key.length === 1) { // Only printable chars
                    buffer += e.key.toLowerCase();
                    if(buffer.length > secret.length) {
                        buffer = buffer.substring(buffer.length - secret.length);
                    }
                    if(buffer === secret && !cyberModeActive) {
                        triggerCyberMode();
                        buffer = '';
                    }
                }
            });

            // Alternative trigger: click footer status multiple times
            const triggerEl = document.getElementById('easter-egg-trigger');
            let clickCount = 0;
            let clickTimeout;
            
            triggerEl.addEventListener('click', () => {
                clickCount++;
                clearTimeout(clickTimeout);
                if(clickCount >= 3 && !cyberModeActive) {
                    triggerCyberMode();
                    clickCount = 0;
                }
                clickTimeout = setTimeout(() => { clickCount = 0; }, 1000);
            });
        }

        function triggerCyberMode() {
            cyberModeActive = true;
            document.body.classList.add('cyber-mode-active');
            
            // Force dark mode temporarily
            const wasDark = isDarkMode;
            if(!isDarkMode) {
                isDarkMode = true;
                updateThemeDOM();
            }

            utils.showToast('Cyber Mode Activated. System privileges granted.', 'cyber');
            
            // Terminal animation if exists
            const term = document.getElementById('terminal-body');
            if(term) {
                const oldHTML = term.innerHTML;
                term.innerHTML += `<div class="text-cyber-green mt-2">[System] Override accepted. Scanning local ports...</div>`;
                setTimeout(() => {
                    if(cyberModeActive) term.innerHTML += `<div class="text-cyber-green">[System] No vulnerabilities found. You are secure.</div>`;
                }, 1500);
            }

            setTimeout(() => {
                document.body.classList.remove('cyber-mode-active');
                cyberModeActive = false;
                if(!wasDark) {
                    isDarkMode = false;
                    updateThemeDOM();
                }
                utils.showToast('Cyber Mode Deactivated. Returning to standard view.', 'info');
            }, 5000);
        }

        // Active Nav Link on Scroll
        function initScrollSpy() {
            const sections = document.querySelectorAll('section[id]');
            const navLinks = document.querySelectorAll('.nav-link');
            
            window.addEventListener('scroll', () => {
                let current = '';
                sections.forEach(section => {
                    const sectionTop = section.offsetTop;
                    const sectionHeight = section.clientHeight;
                    if(pageYOffset >= (sectionTop - 200)) {
                        current = section.getAttribute('id');
                    }
                });

                navLinks.forEach(link => {
                    link.classList.remove('text-cyber-500', 'dark:text-cyber-400', 'font-bold');
                    if(link.getAttribute('href') === `#${current}`) {
                        link.classList.add('text-cyber-500', 'dark:text-cyber-400', 'font-bold');
                    }
                });
            }, { passive: true });
        }

        // Navbar Glass effect on scroll
        function initNavbarScroll() {
            const nav = document.getElementById('navbar');
            const glassDiv = nav.firstElementChild;
            
            window.addEventListener('scroll', () => {
                if (window.scrollY > 20) {
                    nav.classList.remove('mt-4');
                    glassDiv.classList.remove('mx-4', 'sm:mx-8', 'rounded-2xl');
                    glassDiv.classList.add('border-b', 'border-slate-200', 'dark:border-white/10');
                } else {
                    nav.classList.add('mt-4');
                    glassDiv.classList.add('mx-4', 'sm:mx-8', 'rounded-2xl');
                    glassDiv.classList.remove('border-b', 'border-slate-200', 'dark:border-white/10');
                }
            }, { passive: true });
        }

        // ==============================================================================
        // 5. INITIALIZATION
        // ==============================================================================
        
        document.addEventListener('DOMContentLoaded', () => {
            // Render UI
            renderNavigation();
            renderHero();
            renderAboutAndFocus();
            renderProjects();
            renderSkills();
            renderServices();
            renderTimelineAndCerts();
            renderContact();

            // Set static footer info
            document.getElementById('footer-name').textContent = PORTFOLIO_DATA.personal.name;
            document.getElementById('current-year').textContent = new Date().getFullYear();

            // Init Interactions
            initTheme();
            initMobileMenu();
            initContactForm();
            initEasterEgg();
            initScrollSpy();
            initNavbarScroll();

            // Lightbox Event Listeners
            document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
            document.getElementById('lightbox').addEventListener('click', (e) => {
                if(e.target === document.getElementById('lightbox')) closeLightbox();
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && !document.getElementById('lightbox').classList.contains('hidden')) {
                    closeLightbox();
                }
            });
        });
    </script>
</body>
</html>
