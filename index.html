<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yusra's Twitchcord</title>
    <style>
        /* Variabel Warna Twitch */
        :root {
            --twitch-purple: #9146FF;
            --twitch-dark: #18181b;
            --twitch-chat: #0e0e10;
            --text-light: #efeff1;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex; /* Membuat layout samping-sampingan seperti Discord */
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--twitch-dark);
            color: var(--text-light);
        }

        /* Sidebar Ala Discord */
        .sidebar {
            width: 70px;
            background-color: var(--twitch-chat);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 15px;
            border-right: 1px solid #2f2f35;
        }

        .server-icon {
            width: 48px;
            height: 48px;
            background-color: var(--twitch-purple);
            border-radius: 50%; /* Membuat lingkaran */
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .server-icon:hover {
            border-radius: 30%; /* Efek hover ala Discord */
        }

        /* Area Utama */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        header {
            height: 50px;
            background-color: var(--twitch-dark);
            display: flex;
            align-items: center;
            padding: 0 20px;
            border-bottom: 1px solid #2f2f35;
            font-weight: bold;
        }

        .chat-area {
            padding: 20px;
            overflow-y: auto;
        }

        .message {
            margin-bottom: 15px;
        }

        .username {
            color: var(--twitch-purple);
            font-weight: bold;
            margin-right: 8px;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="server-icon">Y</div>
        <div class="server-icon" style="background-color: #333;">+</div>
    </div>

    <div class="main-content">
        <header># belajar-frontend-yusra</header>
        
        <div class="chat-area">
            <div class="message">
                <span class="username">System:</span>
                <span>Selamat datang di server belajar Yusra!</span>
            </div>
            <div class="message">
                <span class="username">Yusra:</span>
                <span>Lagi nyoba bikin tampilan mirip Discord pake warna Twitch nih. 🔥</span>
            </div>
            <div class="message">
                <span class="username">Gemini:</span>
                <span>Keren banget! Ini sudah pakai sistem Flexbox loh.</span>
            </div>
        </div>
    </div>

</body>
</html>
